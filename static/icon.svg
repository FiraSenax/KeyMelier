<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe89a"/>
      <stop offset="0.5" stop-color="#f5bd12"/>
      <stop offset="1" stop-color="#c47f00"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c9d0de"/>
      <stop offset="1" stop-color="#7b869d"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a7a"/>
      <stop offset="0.5" stop-color="#c3183f"/>
      <stop offset="1" stop-color="#6d0a22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="bgC" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4a1330"/><stop offset="0.55" stop-color="#26091a"/><stop offset="1" stop-color="#12050c"/>
    </linearGradient>
    <clipPath id="bowlC"><path d="M348 236 C 336 424, 398 540, 512 552 C 626 540, 688 424, 676 236 Z"/></clipPath>
    <linearGradient id="wineC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd865"/><stop offset="0.45" stop-color="#f4a300"/><stop offset="1" stop-color="#b35f00"/>
    </linearGradient>
    <linearGradient id="bowlShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="0.35" stop-color="#fff" stop-opacity="0.03"/>
      <stop offset="0.8" stop-color="#fff" stop-opacity="0.02"/><stop offset="1" stop-color="#fff" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="keyBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe597"/><stop offset="0.45" stop-color="#f5bb10"/><stop offset="1" stop-color="#b87400"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#ffb938" stop-opacity="0.45"/><stop offset="1" stop-color="#ffb938" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bgC)"/>
  <circle cx="512" cy="420" r="300" fill="url(#halo)"/>
  <ellipse cx="512" cy="830" rx="190" ry="34" fill="url(#floor)"/>

  <g filter="url(#shadow)">
    <!-- bowl glass -->
    <path d="M348 236 C 336 424, 398 540, 512 552 C 626 540, 688 424, 676 236 Z" fill="url(#bowlShade)"/>
    <!-- wine made of bits -->
    <g clip-path="url(#bowlC)">
      <path d="M320 356 C 392 330, 446 382, 512 356 S 636 330, 704 356 L 704 600 L 320 600 Z" fill="url(#wineC)"/>
      <path d="M320 356 C 392 330, 446 382, 512 356 S 636 330, 704 356" fill="none" stroke="#fff3c0" stroke-width="6" stroke-opacity="0.8"/>
      <g fill="#fff6d8">
        <rect x="414" y="398" width="20" height="20" rx="5" opacity="0.55"/>
        <rect x="462" y="430" width="15" height="15" rx="4" opacity="0.5"/>
        <rect x="514" y="394" width="22" height="22" rx="5" opacity="0.55"/>
        <rect x="566" y="432" width="15" height="15" rx="4" opacity="0.5"/>
        <rect x="604" y="398" width="18" height="18" rx="4" opacity="0.5"/>
        <rect x="446" y="482" width="15" height="15" rx="4" opacity="0.45"/>
        <rect x="502" y="468" width="19" height="19" rx="4" opacity="0.5"/>
        <rect x="552" y="494" width="13" height="13" rx="3" opacity="0.45"/>
      </g>
    </g>
    <!-- bits rising like bubbles -->
    <g fill="#ffd865">
      <rect x="470" y="300" width="14" height="14" rx="4" opacity="0.9"/>
      <rect x="540" y="276" width="11" height="11" rx="3" opacity="0.75"/>
      <rect x="500" y="236" width="9" height="9" rx="2" opacity="0.6"/>
      <rect x="566" y="200" width="8" height="8" rx="2" opacity="0.45"/>
      <rect x="452" y="206" width="7" height="7" rx="2" opacity="0.35"/>
    </g>
    <!-- bowl outline, rim, glare -->
    <path d="M348 236 C 336 424, 398 540, 512 552 C 626 540, 688 424, 676 236" fill="none" stroke="#f7eef2" stroke-opacity="0.9" stroke-width="10" stroke-linejoin="round"/>
    <ellipse cx="512" cy="236" rx="164" ry="19" fill="none" stroke="#f7eef2" stroke-opacity="0.95" stroke-width="8"/>
    <path d="M380 286 C 374 382, 398 458, 440 506" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="13" stroke-linecap="round"/>
    <path d="M652 300 C 654 350, 646 392, 630 428" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="8" stroke-linecap="round"/>

    <!-- stem = security key -->
    <rect x="472" y="544" width="80" height="222" rx="32" fill="url(#keyBody)"/>
    <rect x="480" y="552" width="18" height="206" rx="9" fill="#fff" opacity="0.25"/>
    <circle cx="512" cy="646" r="27" fill="#fff4c7"/>
    <g fill="none" stroke="#c47f00" stroke-width="4.5" stroke-linecap="round">
      <path d="M496 654 A 16 16 0 0 1 528 640"/>
      <path d="M503 659 A 9 9 0 0 1 521 649"/>
      <path d="M492 642 A 21 21 0 0 1 526 627"/>
    </g>
    <circle cx="512" cy="738" r="8" fill="#6b2a10" opacity="0.55"/>
    <!-- USB-C plug and foot -->
    <rect x="488" y="764" width="48" height="42" rx="9" fill="url(#metal)"/>
    <rect x="498" y="778" width="28" height="7" rx="3.5" fill="#5d6679"/>
    <ellipse cx="512" cy="812" rx="136" ry="22" fill="url(#metal)"/>
    <ellipse cx="496" cy="806" rx="70" ry="6" fill="#fff" opacity="0.55"/>
  </g>
</svg>
