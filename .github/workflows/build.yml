name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .app with PyInstaller
        env:
          KEYMELIER_ICON: static/icon.icns
        run: |
          pyinstaller --clean --noconfirm fido2tool.spec
          codesign --force --deep --sign - dist/KeyMelier.app
          codesign --verify --deep --strict dist/KeyMelier.app

      - name: Zip the .app
        run: |
          cd dist
          zip -r KeyMelier-macOS.zip KeyMelier.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: KeyMelier-macOS
          path: dist/KeyMelier-macOS.zip
          retention-days: 30

  build-windows:
    name: Build Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .exe with PyInstaller
        env:
          KEYMELIER_ICON: static\icon.ico
        run: pyinstaller --clean --noconfirm fido2tool.spec

      - name: Zip the exe folder
        run: Compress-Archive -Path dist\KeyMelier -DestinationPath dist\KeyMelier-Windows.zip
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: KeyMelier-Windows
          path: dist\KeyMelier-Windows.zip
          retention-days: 30

  release:
    name: Publish release
    needs: [build-macos, build-windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: KeyMelier-macOS
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: KeyMelier-Windows
          path: artifacts

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c "exec(open('fido2tool_core/version.py').read()); print(__version__)")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match fido2tool_core/version.py ($version)"; exit 1
          fi

      # Tag vX.Y.Z: a real release. The app's update check only looks at these.
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: KeyMelier ${{ github.ref_name }}
          make_latest: "true"
          generate_release_notes: true
          body: |
            **Downloads**
            - `KeyMelier-macOS.zip` — macOS app (move KeyMelier.app to Applications)
            - `KeyMelier-Windows.zip` — Windows app folder (run `KeyMelier.exe` as Administrator for FIDO access)

            **First launch on macOS:** the app is not notarized, so macOS blocks it once. Open it, click *Done*, then go to *System Settings → Privacy & Security* and click *Open Anyway*. (Or: `xattr -dr com.apple.quarantine /Applications/KeyMelier.app`)

            **First launch on Windows:** right-click `KeyMelier.exe` → *Run as administrator*. If SmartScreen appears, click *More info* → *Run anyway*.
          files: artifacts/*

      # Push to main: rolling pre-release for testing, never offered as an update.
      - name: Publish nightly pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          make_latest: "false"
          body: |
            Automatically built from the latest commit on `main` (${{ github.sha }}). For testing – stable versions are the numbered releases.
          files: artifacts/*
