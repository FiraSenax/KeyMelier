name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .app with PyInstaller
        env:
          KEYMELIER_ICON: static/icon.icns
        run: |
          pyinstaller --clean --noconfirm fido2tool.spec
          codesign --force --deep --sign - dist/KeyMelier.app
          codesign --verify --deep --strict dist/KeyMelier.app

      - name: Zip the .app
        run: |
          cd dist
          zip -r KeyMelier-macOS.zip KeyMelier.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyMelier-macOS
          path: dist/KeyMelier-macOS.zip
          retention-days: 30

  build-windows:
    name: Build Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .exe with PyInstaller
        env:
          KEYMELIER_ICON: static\icon.ico
        run: pyinstaller --clean --noconfirm fido2tool.spec

      - name: Zip the exe folder
        run: Compress-Archive -Path dist\KeyMelier -DestinationPath dist\KeyMelier-Windows.zip
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyMelier-Windows
          path: dist\KeyMelier-Windows.zip
          retention-days: 30

  release:
    name: Create release
    needs: [build-macos, build-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: KeyMelier-macOS
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: KeyMelier-Windows
          path: artifacts

      - name: Create or update rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build"
          body: |
            Automatically built from the latest commit on `main`.

            **Downloads**
            - `KeyMelier-macOS.zip` — macOS app (move KeyMelier.app to Applications)
            - `KeyMelier-Windows.zip` — Windows app folder (run `KeyMelier.exe` as Administrator for FIDO access)

            **First launch on macOS:** the app is not notarized, so macOS blocks it once. Open it, click *Done*, then go to *System Settings → Privacy & Security* and click *Open Anyway*. (Or: `xattr -dr com.apple.quarantine /Applications/KeyMelier.app`)

            **First launch on Windows:** right-click `KeyMelier.exe` → *Run as administrator*. If SmartScreen appears, click *More info* → *Run anyway*.

            Details: see the README.
          prerelease: false
          make_latest: true
          files: artifacts/*
