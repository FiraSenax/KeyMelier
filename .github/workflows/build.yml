name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: PC/SC headers for pyscard (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcsclite-dev swig
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/advisories_sign.py verify
      - name: Syntax of every UI script
        shell: bash
        run: for f in static/*.js; do node --check "$f"; done
      - run: node tests/ui_security.cjs
      - run: node tests/accounts_model.cjs
  # UI tests on the demo page (no backend, no keys) with real keyboard and
  # mouse input through the DevTools protocol; failures keep a screenshot
  # and the browser log.
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: stable
      - name: UI tests
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          UI_ARTIFACTS: build/ui-test-artifacts
        run: node tests/ui/ui_test.cjs
      - name: Keep screenshot and browser log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-test-artifacts
          path: build/ui-test-artifacts
          if-no-files-found: ignore
  # Signing is used when the credentials are configured as secrets; without
  # them the builds are published unsigned and clearly labelled as such.
  build-macos:
    needs: [test, ui]
    runs-on: macos-14
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-build' }}
    env:
      SIGN_MAC: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_SIGN_IDENTITY != '' }}
    outputs:
      signed: ${{ steps.build.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      # --force-reinstall: packages that come with the runner's Python are
      # replaced by the files from the lock (uninstall first – no stale second
      # copy), so every shipped file is hash-checked and recorded in the
      # report (for the SBOM)
      - name: Install (hash-pinned, every package from the lock)
        shell: bash
        run: |
          mkdir -p build
          python -m pip install --require-hashes --force-reinstall -r requirements.txt -r requirements-build.txt --report build/pip-report.json
      - name: Import Developer ID
        if: env.SIGN_MAC == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash tools/import-macos-signing.sh
      - name: Record the signing state in the app (shown in the introduction)
        run: |
          printf '{"signed": %s, "notarized": %s, "ci": true}\n' "$SIGN_MAC" "$SIGN_MAC" > data/build.json
      - name: Build
        id: build
        env:
          KEYMELIER_ICON: static/icon.icns
          KEYMELIER_SIGN_IDENTITY: ${{ env.SIGN_MAC == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
        run: |
          pyinstaller --clean --noconfirm fido2tool.spec
          if [[ -z "$KEYMELIER_SIGN_IDENTITY" ]]; then
            codesign --force --deep --sign - dist/KeyMelier.app   # ad-hoc: runs locally, no publisher
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
          codesign --verify --deep --strict dist/KeyMelier.app
      - name: Notarize
        if: env.SIGN_MAC == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash tools/sign-macos.sh
      - name: Remove temporary signing keychain
        if: always() && env.SIGN_MAC == 'true'
        run: security delete-keychain "$RUNNER_TEMP/keymelier-signing.keychain-db" || true
      # The built app itself (not app.py): real window, temporary home, no
      # key access, no network; checks libraries, bundled data, translations,
      # icons and the page <-> backend bridge. Failure stops the build.
      - name: Start test of the packaged app
        env:
          SMOKE_ARTIFACTS: build/smoke-artifacts
        run: python tools/smoke_packaged.py
      - name: Keep start test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smoke-artifacts-macos
          path: build/smoke-artifacts
          if-no-files-found: ignore
      - name: Disk image
        env:
          KEYMELIER_SIGN_IDENTITY: ${{ env.SIGN_MAC == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
          PYTHON: python
        run: bash packaging/make-dmg.sh
      - name: Notarize disk image
        if: env.SIGN_MAC == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit dist/KeyMelier-macOS.dmg --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/KeyMelier-macOS.dmg
          spctl --assess --type open --context context:primary-signature --verbose=2 dist/KeyMelier-macOS.dmg
      - run: |
          ditto -c -k --keepParent dist/KeyMelier.app dist/KeyMelier-macOS.zip
          cp build/THIRD_PARTY_LICENSES.txt dist/THIRD_PARTY_LICENSES-macOS.txt
          cp build/keymelier-sbom.cdx.json dist/KeyMelier-macOS.cdx.json
          python tools/sbom.py --check dist/KeyMelier-macOS.cdx.json --strict
      - name: Validate the macOS artifacts (structure, version, signing state, SBOM, licences)
        env:
          SIGNED: ${{ steps.build.outputs.signed }}
        run: python tools/check_artifacts.py macos dist --signed "$SIGNED" --strict-sbom 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: KeyMelier-macOS
          path: |
            dist/KeyMelier-macOS.dmg
            dist/KeyMelier-macOS.zip
            dist/THIRD_PARTY_LICENSES-macOS.txt
            dist/KeyMelier-macOS.cdx.json
          retention-days: 14
  build-windows:
    needs: [test, ui]
    runs-on: windows-2022
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-build' }}
    permissions:
      contents: read
      actions: read   # SignPath downloads the unsigned artifact of this run
    env:
      SIGN_WIN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    outputs:
      signed: ${{ steps.signed.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      # --force-reinstall: packages that come with the runner's Python are
      # replaced by the files from the lock (uninstall first – no stale second
      # copy), so every shipped file is hash-checked and recorded in the
      # report (for the SBOM)
      - name: Install (hash-pinned, every package from the lock)
        shell: bash
        run: |
          mkdir -p build
          python -m pip install --require-hashes --force-reinstall -r requirements.txt -r requirements-build.txt --report build/pip-report.json
      - name: Record the signing state in the app (shown in the introduction)
        shell: bash
        run: |
          printf '{"signed": %s, "ci": true}\n' "$SIGN_WIN" > data/build.json
      - name: Build
        env:
          KEYMELIER_ICON: static\icon.ico
        run: pyinstaller --clean --noconfirm fido2tool.spec
      # Free code signing for open source by the SignPath Foundation: the
      # unsigned build goes to SignPath, which signs KeyMelier.exe with a key
      # held in its HSM (see CODE_SIGNING.md and .signpath/).
      - name: Upload unsigned build for signing
        if: env.SIGN_WIN == 'true'
        id: unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-windows-build  # must not match the release pattern KeyMelier-*
          path: dist/KeyMelier
          retention-days: 1
      - name: Sign with SignPath
        if: env.SIGN_WIN == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          connector-url: https://githubactions.connector.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/KeyMelier-signed
      - name: Use and verify the signed build
        if: env.SIGN_WIN == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist\KeyMelier-signed\KeyMelier.exe
          if ($sig.Status -ne 'Valid') { throw "Invalid signature: $($sig.Status)" }
          Write-Host "Signed by: $($sig.SignerCertificate.Subject)"
          Remove-Item -Recurse -Force dist\KeyMelier
          Move-Item dist\KeyMelier-signed dist\KeyMelier
      # The built app itself (not app.py): real window, temporary home, no
      # key access, no network; checks libraries, bundled data, translations,
      # icons and the page <-> backend bridge. Failure stops the build.
      - name: Start test of the packaged app
        env:
          SMOKE_ARTIFACTS: build/smoke-artifacts
        run: python tools/smoke_packaged.py
      - name: Keep start test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smoke-artifacts-windows
          path: build/smoke-artifacts
          if-no-files-found: ignore
      - name: Installer
        shell: pwsh
        run: |
          $version = python -c "from fido2tool_core.version import __version__; print(__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\keymelier.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
      - name: Upload unsigned installer for signing
        if: env.SIGN_WIN == 'true'
        id: unsigned_setup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-windows-setup  # must not match the release pattern KeyMelier-*
          path: dist/KeyMelier-Windows-Setup.exe
          retention-days: 1
      - name: Sign installer with SignPath
        if: env.SIGN_WIN == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          connector-url: https://githubactions.connector.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned_setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/setup-signed
      - name: Use and verify the signed installer
        if: env.SIGN_WIN == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist\setup-signed\KeyMelier-Windows-Setup.exe
          if ($sig.Status -ne 'Valid') { throw "Invalid installer signature: $($sig.Status)" }
          Move-Item -Force dist\setup-signed\KeyMelier-Windows-Setup.exe dist\KeyMelier-Windows-Setup.exe
      - name: Record signing state
        id: signed
        shell: bash
        run: echo "signed=$SIGN_WIN" >> "$GITHUB_OUTPUT"
      - run: |
          Compress-Archive -Path dist\KeyMelier -DestinationPath dist\KeyMelier-Windows.zip
          Copy-Item build\THIRD_PARTY_LICENSES.txt dist\THIRD_PARTY_LICENSES-Windows.txt
          Copy-Item build\keymelier-sbom.cdx.json dist\KeyMelier-Windows.cdx.json
          python tools/sbom.py --check dist\KeyMelier-Windows.cdx.json --strict
          if ($LASTEXITCODE -ne 0) { throw "SBOM check failed" }
      - name: Validate the Windows artifacts (structure, versions, signing state, SBOM, licences)
        shell: pwsh
        run: |
          python tools/check_artifacts.py windows dist --signed "$env:SIGN_WIN" --strict-sbom 1
          if ($LASTEXITCODE -ne 0) { throw "Artifact check failed" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: KeyMelier-Windows
          path: |
            dist/KeyMelier-Windows-Setup.exe
            dist/KeyMelier-Windows.zip
            dist/THIRD_PARTY_LICENSES-Windows.txt
            dist/KeyMelier-Windows.cdx.json
          retention-days: 14
  # Linux: AppImage for x86-64 and ARM64 (Qt web view, unsigned). The same
  # script as locally (build-linux.sh); the start test runs the AppImage itself
  # under Xvfb with a D-Bus session and an unlocked Secret Service.
  build-linux:
    needs: [test, ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: System packages (build, Qt WebEngine runtime, start test)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv python3-dev libpcsclite-dev swig squashfs-tools \
            libminizip1t64 libopus0 libsnappy1v5 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-xinput0 libegl1 libgl1 libopengl0 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64 libxkbfile1 libfontconfig1 \
            libdbus-1-3 libxshmfence1 libgbm1 \
            xvfb xauth imagemagick dbus-x11 gnome-keyring
      - name: Record the signing state in the app (shown in the introduction)
        run: |
          printf '{"signed": false, "ci": true}\n' > data/build.json
      # Hash-pinned install into a fresh venv (--force-reinstall, pip report
      # for the SBOM), PyInstaller, strict SBOM check, AppImage with pinned
      # and checksum-verified appimagetool/runtime
      - name: Build
        run: ./build-linux.sh
      - name: Start test of the packaged AppImage
        env:
          SMOKE_ARTIFACTS: build/smoke-artifacts
        run: |
          xvfb-run -a -s "-screen 0 1400x900x24" dbus-run-session -- bash -c '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            python3 tools/smoke_packaged.py "dist/KeyMelier-Linux-$ARCH.AppImage"'
      - name: Keep start test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smoke-artifacts-linux-${{ matrix.arch }}
          path: build/smoke-artifacts
          if-no-files-found: ignore
      - name: Validate the Linux artifacts (ELF, AppImage contents, version, SBOM, licences)
        run: |
          cp build/THIRD_PARTY_LICENSES.txt "dist/THIRD_PARTY_LICENSES-Linux-$ARCH.txt"
          cp build/keymelier-sbom.cdx.json "dist/KeyMelier-Linux-$ARCH.cdx.json"
          python3 tools/check_artifacts.py linux dist --arch "$ARCH" --strict-sbom 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: KeyMelier-Linux-${{ matrix.arch }}
          path: |
            dist/KeyMelier-Linux-${{ matrix.arch }}.AppImage
            dist/THIRD_PARTY_LICENSES-Linux-${{ matrix.arch }}.txt
            dist/KeyMelier-Linux-${{ matrix.arch }}.cdx.json
          retention-days: 14
  release:
    needs: [build-macos, build-windows, build-linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check release version
        run: |
          version=$(python3 -c "from fido2tool_core.version import __version__; print(__version__)")
          test "v$version" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: KeyMelier-*
          merge-multiple: true
          path: artifacts
      # The artifact transfer drops the execute bit; restore it on exactly the
      # two AppImages (a missing one fails here)
      - name: Make the AppImages executable again
        run: python3 tools/check_artifacts.py restore-exec artifacts
      - name: Tools for looking inside the AppImages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools
      - name: Attach source revision and dependency locks
        run: |
          cp uv.lock requirements.txt requirements-build.txt artifacts/
          printf '%s\n' "$GITHUB_SHA" > artifacts/SOURCE_COMMIT.txt
          cd artifacts
          sha256sum * > SHA256SUMS.txt
      - name: Release notes with the actual signing state
        env:
          MAC_SIGNED: ${{ needs.build-macos.outputs.signed }}
          WIN_SIGNED: ${{ needs.build-windows.outputs.signed }}
        run: |
          {
            echo "**Downloads**"
            if [ "$MAC_SIGNED" = "true" ]; then
              echo "- \`KeyMelier-macOS.dmg\` – **macOS** (recommended): open it and drag KeyMelier to Applications (replaces an older version). Developer ID signed and notarized."
            else
              echo "- \`KeyMelier-macOS.dmg\` – **macOS** (recommended): open it and drag KeyMelier to Applications (replaces an older version). **Not notarized** – first launch: open it, click *Done*, then *System Settings → Privacy & Security → Open Anyway*."
            fi
            if [ "$WIN_SIGNED" = "true" ]; then
              echo "- \`KeyMelier-Windows-Setup.exe\` – **Windows** installer (recommended): installs or updates KeyMelier. Signed via SignPath Foundation."
            else
              echo "- \`KeyMelier-Windows-Setup.exe\` – **Windows** installer (recommended): installs or updates KeyMelier. **Not signed** – if SmartScreen appears: *More info* → *Run anyway*."
            fi
            echo "- \`KeyMelier-Linux-x86_64.AppImage\`, \`KeyMelier-Linux-aarch64.AppImage\` – **Linux** (x86-64 / ARM64): make it executable (\`chmod +x\`) and start it. **Unsigned** – compare the checksum. If your key does not appear, see *Linux* in the documentation (udev rules)."
            echo "- \`KeyMelier-macOS.zip\`, \`KeyMelier-Windows.zip\` – the same apps without installer (portable)."
            echo
            echo "Checksums (SHA256SUMS.txt), dependency locks and the source commit are attached. Unsigned builds have no verified publisher – compare the checksums if in doubt."
          } > release-notes.md
          cat release-notes.md
      - name: Validate everything that will be published
        env:
          MAC_SIGNED: ${{ needs.build-macos.outputs.signed }}
          WIN_SIGNED: ${{ needs.build-windows.outputs.signed }}
        run: >-
          python3 tools/check_artifacts.py release artifacts --commit "$GITHUB_SHA" --notes release-notes.md
          --mac-signed "$MAC_SIGNED" --win-signed "$WIN_SIGNED"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: KeyMelier ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: 'true'
          body_path: release-notes.md
          files: artifacts/*
