name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/advisories_sign.py verify
      - run: node --check static/app.js
      - run: node --check static/i18n.js
      - run: node tests/ui_security.cjs
      - run: node tests/accounts_model.cjs
  # Signing is used when the credentials are configured as secrets; without
  # them the builds are published unsigned and clearly labelled as such.
  build-macos:
    needs: test
    runs-on: macos-14
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-build' }}
    env:
      SIGN_MAC: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_SIGN_IDENTITY != '' }}
    outputs:
      signed: ${{ steps.build.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.txt -r requirements-build.txt
      - name: Import Developer ID
        if: env.SIGN_MAC == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash tools/import-macos-signing.sh
      - name: Build
        id: build
        env:
          KEYMELIER_ICON: static/icon.icns
          KEYMELIER_SIGN_IDENTITY: ${{ env.SIGN_MAC == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
        run: |
          pyinstaller --clean --noconfirm fido2tool.spec
          if [[ -z "$KEYMELIER_SIGN_IDENTITY" ]]; then
            codesign --force --deep --sign - dist/KeyMelier.app   # ad-hoc: runs locally, no publisher
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
          codesign --verify --deep --strict dist/KeyMelier.app
      - name: Notarize
        if: env.SIGN_MAC == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash tools/sign-macos.sh
      - name: Remove temporary signing keychain
        if: always() && env.SIGN_MAC == 'true'
        run: security delete-keychain "$RUNNER_TEMP/keymelier-signing.keychain-db" || true
      - name: Disk image
        env:
          KEYMELIER_SIGN_IDENTITY: ${{ env.SIGN_MAC == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
          PYTHON: python
        run: bash packaging/make-dmg.sh
      - name: Notarize disk image
        if: env.SIGN_MAC == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit dist/KeyMelier-macOS.dmg --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/KeyMelier-macOS.dmg
          spctl --assess --type open --context context:primary-signature --verbose=2 dist/KeyMelier-macOS.dmg
      - run: |
          ditto -c -k --keepParent dist/KeyMelier.app dist/KeyMelier-macOS.zip
          cp build/THIRD_PARTY_LICENSES.txt dist/THIRD_PARTY_LICENSES-macOS.txt
          cp build/keymelier-sbom.cdx.json dist/KeyMelier-macOS.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: KeyMelier-macOS
          path: |
            dist/KeyMelier-macOS.dmg
            dist/KeyMelier-macOS.zip
            dist/THIRD_PARTY_LICENSES-macOS.txt
            dist/KeyMelier-macOS.cdx.json
          retention-days: 14
  build-windows:
    needs: test
    runs-on: windows-2022
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-build' }}
    permissions:
      contents: read
      actions: read   # SignPath downloads the unsigned artifact of this run
    env:
      SIGN_WIN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    outputs:
      signed: ${{ steps.signed.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.txt -r requirements-build.txt
      - name: Build
        env:
          KEYMELIER_ICON: static\icon.ico
        run: pyinstaller --clean --noconfirm fido2tool.spec
      # Free code signing for open source by the SignPath Foundation: the
      # unsigned build goes to SignPath, which signs KeyMelier.exe with a key
      # held in its HSM (see CODE_SIGNING.md and .signpath/).
      - name: Upload unsigned build for signing
        if: env.SIGN_WIN == 'true'
        id: unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-windows-build  # must not match the release pattern KeyMelier-*
          path: dist/KeyMelier
          retention-days: 1
      - name: Sign with SignPath
        if: env.SIGN_WIN == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          connector-url: https://githubactions.connector.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/KeyMelier-signed
      - name: Use and verify the signed build
        if: env.SIGN_WIN == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist\KeyMelier-signed\KeyMelier.exe
          if ($sig.Status -ne 'Valid') { throw "Invalid signature: $($sig.Status)" }
          Write-Host "Signed by: $($sig.SignerCertificate.Subject)"
          Remove-Item -Recurse -Force dist\KeyMelier
          Move-Item dist\KeyMelier-signed dist\KeyMelier
      - name: Installer
        shell: pwsh
        run: |
          $version = python -c "from fido2tool_core.version import __version__; print(__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\keymelier.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
      - name: Upload unsigned installer for signing
        if: env.SIGN_WIN == 'true'
        id: unsigned_setup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-windows-setup  # must not match the release pattern KeyMelier-*
          path: dist/KeyMelier-Windows-Setup.exe
          retention-days: 1
      - name: Sign installer with SignPath
        if: env.SIGN_WIN == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          connector-url: https://githubactions.connector.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned_setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/setup-signed
      - name: Use and verify the signed installer
        if: env.SIGN_WIN == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist\setup-signed\KeyMelier-Windows-Setup.exe
          if ($sig.Status -ne 'Valid') { throw "Invalid installer signature: $($sig.Status)" }
          Move-Item -Force dist\setup-signed\KeyMelier-Windows-Setup.exe dist\KeyMelier-Windows-Setup.exe
      - name: Record signing state
        id: signed
        shell: bash
        run: echo "signed=$SIGN_WIN" >> "$GITHUB_OUTPUT"
      - run: |
          Compress-Archive -Path dist\KeyMelier -DestinationPath dist\KeyMelier-Windows.zip
          Copy-Item build\THIRD_PARTY_LICENSES.txt dist\THIRD_PARTY_LICENSES-Windows.txt
          Copy-Item build\keymelier-sbom.cdx.json dist\KeyMelier-Windows.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: KeyMelier-Windows
          path: |
            dist/KeyMelier-Windows-Setup.exe
            dist/KeyMelier-Windows.zip
            dist/THIRD_PARTY_LICENSES-Windows.txt
            dist/KeyMelier-Windows.cdx.json
          retention-days: 14
  release:
    needs: [build-macos, build-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check release version
        run: |
          version=$(python3 -c "from fido2tool_core.version import __version__; print(__version__)")
          test "v$version" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: KeyMelier-*
          merge-multiple: true
          path: artifacts
      - name: Attach source revision and dependency locks
        run: |
          cp uv.lock requirements.txt requirements-build.txt artifacts/
          printf '%s\n' "$GITHUB_SHA" > artifacts/SOURCE_COMMIT.txt
          cd artifacts
          sha256sum * > SHA256SUMS.txt
      - name: Release notes with the actual signing state
        env:
          MAC_SIGNED: ${{ needs.build-macos.outputs.signed }}
          WIN_SIGNED: ${{ needs.build-windows.outputs.signed }}
        run: |
          {
            echo "**Downloads**"
            if [ "$MAC_SIGNED" = "true" ]; then
              echo "- \`KeyMelier-macOS.dmg\` – **macOS** (recommended): open it and drag KeyMelier to Applications (replaces an older version). Developer ID signed and notarized."
            else
              echo "- \`KeyMelier-macOS.dmg\` – **macOS** (recommended): open it and drag KeyMelier to Applications (replaces an older version). **Not notarized** – first launch: open it, click *Done*, then *System Settings → Privacy & Security → Open Anyway*."
            fi
            if [ "$WIN_SIGNED" = "true" ]; then
              echo "- \`KeyMelier-Windows-Setup.exe\` – **Windows** installer (recommended): installs or updates KeyMelier. Signed via SignPath Foundation."
            else
              echo "- \`KeyMelier-Windows-Setup.exe\` – **Windows** installer (recommended): installs or updates KeyMelier. **Not signed** – if SmartScreen appears: *More info* → *Run anyway*."
            fi
            echo "- \`KeyMelier-macOS.zip\`, \`KeyMelier-Windows.zip\` – the same apps without installer (portable)."
            echo
            echo "Checksums (SHA256SUMS.txt), dependency locks and the source commit are attached. Unsigned builds have no verified publisher – compare the checksums if in doubt."
          } > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: KeyMelier ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: 'true'
          body_path: release-notes.md
          files: artifacts/*
