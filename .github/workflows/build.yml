name: Build
on:
  push:
    branches: [main]
    tags: ['v*', '!vsigncheck-*']   # vsigncheck-*: signing-check.yml only, never a release
  pull_request:
    branches: [main, "codex/pr21-*"]
  workflow_dispatch:
    inputs:
      signed_rc:
        description: 'Signed/notarized RC rehearsal (artifact-only unless publish_rc is also enabled)'
        type: boolean
        default: false
        required: false
      publish_rc:
        description: 'Publish a signed RC tag as a GitHub prerelease after all checks (requires signed_rc)'
        type: boolean
        default: false
        required: false
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15   # a hanging test fails the run instead of blocking a runner for hours
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: PC/SC headers for pyscard (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcsclite-dev swig
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: Install isolated test and lint dependencies (hash-pinned wheels)
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-quality.txt
      - name: Static correctness checks
        if: runner.os == 'Linux'
        run: |
          ruff check app.py keymelier_core tools
          ruff check tools tests --select E9,F63,F7,F82
      - name: Verify locked dependency exports (offline)
        run: |
          python tools/export_requirements.py --check
          python tools/license_inputs.py
      - name: Reject an accidental update-key emergency stop
        run: python tools/check_update_revocation.py
      - run: python -m unittest discover -s tests -v
      - name: Windows runtime prerequisite safety tests
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/windows_runtime_test.ps1
      - run: python tools/advisories_sign.py verify
      - name: Require recently reviewed advisories for release builds
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.signed_rc)
        run: python tools/advisories_sign.py verify --max-age-days 14
      - name: Syntax of every UI script
        shell: bash
        run: for f in static/*.js; do node --check "$f"; done
      - run: node tests/ui_security.cjs
      - run: node tests/accounts_model.cjs
      - run: node tests/website_release.cjs
  # UI tests on the demo page (no backend, no keys) with real keyboard and
  # mouse input through the DevTools protocol; failures keep a screenshot
  # and the browser log.
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: stable
      - name: UI tests
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          UI_ARTIFACTS: build/ui-test-artifacts
        run: node tests/ui/ui_test.cjs
      - name: UI under load (300+ accounts, minimum window size, light/dark)
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          UI_ARTIFACTS: build/ui-test-artifacts
        run: node tests/ui/ui_stress.cjs
      - name: Keep screenshot and browser log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-test-artifacts
          path: build/ui-test-artifacts
          if-no-files-found: ignore
  # Signing is used when the credentials are configured as secrets; without
  # them the builds are published unsigned and clearly labelled as such.
  build-macos:
    needs: [test, ui]
    runs-on: macos-14
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.signed_rc)) && 'release-signing' || 'test-build' }}
    env:
      # zxing 3.1 uses C++20 aggregate initialization missing in the runner's
      # default Xcode 15.4; select the installed C++20-capable toolchain.
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      SIGN_MAC: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.signed_rc)) && secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_SIGN_IDENTITY != '' }}
    outputs:
      signed: ${{ steps.build.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      # --force-reinstall: packages that come with the runner's Python are
      # replaced by the files from the lock (uninstall first – no stale second
      # copy), so every shipped file is hash-checked and recorded in the
      # report (for the SBOM)
      - name: Install (hash-pinned, every package from the lock)
        shell: bash
        run: |
          mkdir -p build
          python -m pip install --require-hashes --force-reinstall -r requirements.txt -r requirements-build.txt --report build/pip-report.json
          python tools/build_zxing.py
      - name: Require signing and notarization for a signed RC
        if: (github.event_name == 'workflow_dispatch' && inputs.signed_rc) || (startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc.'))
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
            python tools/check_rc_ref.py "$GITHUB_REF_NAME"
          fi
          for name in MACOS_CERTIFICATE_P12 MACOS_SIGN_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Signed RC requires $name in the release-signing environment. No unsigned fallback."
              exit 1
            fi
          done
      - name: Import Developer ID
        if: env.SIGN_MAC == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash tools/import-macos-signing.sh
      - name: Record signing state and source commit in the app (introduction, About, diagnostics)
        run: |
          python tools/write_build_info.py --signed "$SIGN_MAC" --notarized "$SIGN_MAC" --ci
      - name: Build
        id: build
        env:
          KEYMELIER_ICON: static/icon.icns
          KEYMELIER_SIGN_IDENTITY: ${{ env.SIGN_MAC == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
        run: |
          pyinstaller --clean --noconfirm keymelier.spec
          if [[ -z "$KEYMELIER_SIGN_IDENTITY" ]]; then
            codesign --force --deep --sign - dist/KeyMelier.app   # ad-hoc: runs locally, no publisher
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
          codesign --verify --deep --strict dist/KeyMelier.app
      - name: Notarize
        if: env.SIGN_MAC == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash tools/sign-macos.sh
      # The built app itself (not app.py): real window, temporary home, no
      # key access, no network; checks libraries, bundled data, translations,
      # icons and the page <-> backend bridge. Failure stops the build.
      - name: Start test of the packaged app
        env:
          SMOKE_ARTIFACTS: build/smoke-artifacts
        run: |
          python tools/smoke_packaged.py
          python tools/check_library_replacement.py
      - name: Keep start test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-artifacts-macos
          path: build/smoke-artifacts
          if-no-files-found: ignore
      - name: Disk image
        env:
          KEYMELIER_SIGN_IDENTITY: ${{ env.SIGN_MAC == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
          PYTHON: python
        run: bash packaging/make-dmg.sh
      - name: Notarize disk image
        if: env.SIGN_MAC == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit dist/KeyMelier-macOS.dmg --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/KeyMelier-macOS.dmg
          spctl --assess --type open --context context:primary-signature --verbose=2 dist/KeyMelier-macOS.dmg
      # Only after the last use of the identity (the disk image is signed too)
      - name: Remove temporary signing keychain
        if: always() && env.SIGN_MAC == 'true'
        run: security delete-keychain "$RUNNER_TEMP/keymelier-signing.keychain-db" || true
      - run: |
          ditto -c -k --keepParent dist/KeyMelier.app dist/KeyMelier-macOS.zip
          cp build/THIRD_PARTY_LICENSES.txt dist/THIRD_PARTY_LICENSES-macOS.txt
          cp build/keymelier-sbom.cdx.json dist/KeyMelier-macOS.cdx.json
          python tools/sbom.py --check dist/KeyMelier-macOS.cdx.json --strict
      - name: Validate the macOS artifacts (structure, version, signing state, SBOM, licences)
        env:
          SIGNED: ${{ steps.build.outputs.signed }}
        run: python tools/check_artifacts.py macos dist --signed "$SIGNED" --strict-sbom 1 --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: KeyMelier-macOS
          path: |
            dist/KeyMelier-macOS.dmg
            dist/KeyMelier-macOS.zip
            dist/THIRD_PARTY_LICENSES-macOS.txt
            dist/KeyMelier-macOS.cdx.json
            dist/KeyMelier-Sources-macOS.tar
          retention-days: 14
  build-windows:
    needs: [test, ui]
    runs-on: windows-2022
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.signed_rc)) && 'release-signing' || 'test-build' }}
    timeout-minutes: 35
    concurrency:
      group: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.signed_rc)) && 'certum-signing' || format('windows-build-{0}', github.run_id) }}
      cancel-in-progress: false
    env:
      SIGN_WIN: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.signed_rc)) && vars.WINDOWS_SIGNING_ENABLED == 'true' }}
      CERTUM_CERT_SHA1: ${{ vars.CERTUM_CERT_SHA1 }}
    outputs:
      signed: ${{ steps.signed.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      # --force-reinstall: packages that come with the runner's Python are
      # replaced by the files from the lock (uninstall first – no stale second
      # copy), so every shipped file is hash-checked and recorded in the
      # report (for the SBOM)
      - name: Install (hash-pinned, every package from the lock)
        shell: bash
        run: |
          mkdir -p build
          python -m pip install --require-hashes --force-reinstall -r requirements.txt -r requirements-build.txt --report build/pip-report.json
          python tools/build_zxing.py
      - name: Validate Windows signing mode
        shell: pwsh
        env:
          WINDOWS_SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED }}
        run: |
          if ([string]$env:WINDOWS_SIGNING_ENABLED -notin @('', 'false', 'true')) {
            throw 'WINDOWS_SIGNING_ENABLED must be unset, false or true.'
          }
      - name: Record signing state and source commit in the app (introduction, About, diagnostics)
        shell: bash
        run: |
          python tools/write_build_info.py --signed "$SIGN_WIN" --ci
      - name: Build
        env:
          KEYMELIER_ICON: static\icon.ico
        run: pyinstaller --clean --noconfirm keymelier.spec
      - name: Connect Certum SimplySign
        if: env.SIGN_WIN == 'true'
        uses: ./.github/actions/certum-connect
        with:
          username: ${{ secrets.CERTUM_USERNAME }}
          totp-secret: ${{ secrets.CERTUM_TOTP_SECRET }}
          thumbprint: ${{ vars.CERTUM_CERT_SHA1 }}
      - name: Sign and verify the app
        if: env.SIGN_WIN == 'true'
        shell: pwsh
        run: ./tools/sign-windows.ps1 -Path dist/KeyMelier/KeyMelier.exe
      - name: Build installer and sign its uninstaller and setup when enabled
        shell: pwsh
        run: |
          $version = python -c "from keymelier_core.version import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the app version.' }
          ./tools/build-windows-installer.ps1 -AppVersion $version -Signed:($env:SIGN_WIN -eq 'true')
      - name: Disconnect SimplySign before running packaged code
        if: always() && env.SIGN_WIN == 'true'
        shell: pwsh
        run: ./tools/disconnect-simplysign.ps1
      # Start only after signing and cleanup. No cloud login credentials are
      # provided to this process (real window, temporary home, no key access).
      - name: Start test of the packaged app
        env:
          SMOKE_ARTIFACTS: build/smoke-artifacts
        run: |
          python tools/smoke_packaged.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_library_replacement.py
      - name: Keep start test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-artifacts-windows
          path: build/smoke-artifacts
          if-no-files-found: ignore
      - name: Record signing state
        id: signed
        shell: bash
        run: echo "signed=$SIGN_WIN" >> "$GITHUB_OUTPUT"
      - run: |
          Compress-Archive -Path dist\KeyMelier -DestinationPath dist\KeyMelier-Windows.zip
          Copy-Item build\THIRD_PARTY_LICENSES.txt dist\THIRD_PARTY_LICENSES-Windows.txt
          Copy-Item build\keymelier-sbom.cdx.json dist\KeyMelier-Windows.cdx.json
          python tools/sbom.py --check dist\KeyMelier-Windows.cdx.json --strict
          if ($LASTEXITCODE -ne 0) { throw "SBOM check failed" }
      - name: Validate the Windows artifacts (structure, versions, signing state, SBOM, licences)
        shell: pwsh
        run: |
          python tools/check_artifacts.py windows dist --signed "$env:SIGN_WIN" --strict-sbom 1 --commit "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw "Artifact check failed" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: KeyMelier-Windows
          path: |
            dist/KeyMelier-Windows-Setup.exe
            dist/KeyMelier-Windows.zip
            dist/THIRD_PARTY_LICENSES-Windows.txt
            dist/KeyMelier-Windows.cdx.json
            dist/KeyMelier-Sources-Windows.tar
          retention-days: 14
  # Linux: AppImage for x86-64 and ARM64 (Qt web view, unsigned). The same
  # script as locally (build-linux.sh); the start test runs the AppImage itself
  # under Xvfb with a D-Bus session and an unlocked Secret Service.
  build-linux:
    needs: [test, ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: System packages (build, Qt WebEngine runtime, start test)
        run: |
          # Source packages must match the native libraries collected below.
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          # Expose ordinary HTTPS source URLs instead of APT's mirror+file URIs.
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv python3-dev libpcsclite-dev swig squashfs-tools liblzma5 \
            libminizip1t64 libopus0 libsnappy1v5 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-xinput0 libegl1 libgl1 libopengl0 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64 libxkbfile1 libfontconfig1 \
            libdbus-1-3 libxshmfence1 libgbm1 \
            xvfb xauth imagemagick dbus-x11 gnome-keyring
      - name: Record signing state and source commit in the app (introduction, About, diagnostics)
        run: |
          python3 tools/write_build_info.py --signed false --ci
      # Hash-pinned install into a fresh venv (--force-reinstall, pip report
      # for the SBOM), PyInstaller, strict SBOM check, AppImage with pinned
      # and checksum-verified appimagetool/runtime
      - name: Build
        run: ./build-linux.sh
      - name: Start test of the packaged AppImage
        env:
          SMOKE_ARTIFACTS: build/smoke-artifacts
        run: |
          xvfb-run -a -s "-screen 0 1400x900x24" dbus-run-session -- bash -c '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            python3 tools/smoke_packaged.py "dist/KeyMelier-Linux-$ARCH.AppImage" &&
            python3 tools/check_library_replacement.py'
      - name: Keep start test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-artifacts-linux-${{ matrix.arch }}
          path: build/smoke-artifacts
          if-no-files-found: ignore
      - name: Validate the Linux artifacts (ELF, AppImage contents, version, SBOM, licences)
        run: |
          cp build/THIRD_PARTY_LICENSES.txt "dist/THIRD_PARTY_LICENSES-Linux-$ARCH.txt"
          cp build/keymelier-sbom.cdx.json "dist/KeyMelier-Linux-$ARCH.cdx.json"
          python3 tools/check_artifacts.py linux dist --arch "$ARCH" --strict-sbom 1 --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: KeyMelier-Linux-${{ matrix.arch }}
          path: |
            dist/KeyMelier-Linux-${{ matrix.arch }}.AppImage
            dist/THIRD_PARTY_LICENSES-Linux-${{ matrix.arch }}.txt
            dist/KeyMelier-Linux-${{ matrix.arch }}.cdx.json
            dist/KeyMelier-Sources-Linux-${{ matrix.arch }}.tar
          retention-days: 14
  # The AppImages built above, unchanged, in clean containers of the supported
  # distributions (tools/linux_compat.py): only the documented runtime
  # packages, the packaged start test under Xvfb, the file's SHA-256 recorded
  # first. Native on both architectures. A failing supported combination
  # blocks the release. Not covered: USB/key access, Wayland, real desktops.
  linux-compat:
    needs: [build-linux]
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        image: ['ubuntu:24.04', 'ubuntu:26.04', 'debian:13', 'fedora:43', 'opensuse/leap:16.0', 'archlinux:latest']
        exclude:
          - arch: aarch64
            image: 'archlinux:latest'   # no official ARM64 image
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: KeyMelier-Linux-${{ matrix.arch }}
          path: appimage
      - name: Start test in ${{ matrix.image }}
        run: python3 tools/linux_compat.py run "appimage/KeyMelier-Linux-${{ matrix.arch }}.AppImage" "${{ matrix.image }}" --out compat
      - name: Result
        if: always()
        run: python3 tools/linux_compat.py report compat >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: linux-compat-${{ matrix.arch }}-${{ strategy.job-index }}
          path: compat
          retention-days: 14
  # The real release (version tags only) and the rehearsal (manual runs) share
  # every step up to publishing: .github/actions/prepare-release
  release:
    needs: [test, ui, build-macos, build-windows, build-linux, linux-compat]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc.')
    runs-on: ubuntu-24.04
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check release version
        run: |
          version=$(python3 -c "from keymelier_core.version import __version__; print(__version__)")
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Require completed production signing
        env:
          MAC_SIGNED: ${{ needs.build-macos.outputs.signed }}
          WIN_SIGNED: ${{ needs.build-windows.outputs.signed }}
        run: |
          if [ "$MAC_SIGNED" != true ] || [ "$WIN_SIGNED" != true ]; then
            echo "::error::Stable releases require verified macOS and Windows signing. Complete signing setup before publishing."
            exit 1
          fi
      - uses: ./.github/actions/prepare-release
        with:
          mac-signed: ${{ needs.build-macos.outputs.signed }}
          win-signed: ${{ needs.build-windows.outputs.signed }}
      - uses: ./.github/actions/sign-update
        with:
          directory: artifacts
          private-key: ${{ secrets.KEYMELIER_UPDATE_SIGNING_KEY }}
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: KeyMelier ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: 'true'
          body_path: release-notes.md
          files: artifacts/*
  # RC tags (v<version>-rc.N) and release rehearsals: the same builds, the real artifact
  # transfer (upload in the build jobs, download here) and the same checks as
  # the release – but no release, no tag and no write access. The checked
  # packages and the report are kept as the artifact "release-rehearsal".
  release-rehearsal:
    needs: [test, ui, build-macos, build-windows, build-linux, linux-compat]
    # also after a failed job: the report then shows which one (and fails)
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc.'))))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-release
        with:
          mac-signed: ${{ needs.build-macos.outputs.signed }}
          win-signed: ${{ needs.build-windows.outputs.signed }}
          jobs: >-
            test=${{ needs.test.result }},ui=${{ needs.ui.result }},build-macos=${{ needs.build-macos.result }},build-windows=${{ needs.build-windows.result }},build-linux=${{ needs.build-linux.result }},linux-compat=${{ needs.linux-compat.result }}
      - name: Verify signed RC result
        if: (github.event_name == 'workflow_dispatch' && inputs.signed_rc) || (startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc.'))
        env:
          MAC_SIGNED: ${{ needs.build-macos.outputs.signed }}
        run: |
          test "$MAC_SIGNED" = true
          echo "Signed RC rehearsal verified: notarized macOS app and DMG, tested packages. Public RCs are published by the following release-candidate job." >> "$GITHUB_STEP_SUMMARY"
      - name: Report
        if: always()
        run: |
          if [ -f release-check.md ]; then cat release-check.md >> "$GITHUB_STEP_SUMMARY"; else echo "No report – the preparation failed before the checks (see the step log)." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: release-rehearsal   # does not match KeyMelier-*: never picked up by a release
          path: |
            artifacts
            release-notes.md
            release-check.md
          if-no-files-found: warn
          retention-days: 30
  # Reviewed RC tag pushes publish automatically; manual rehearsals require opt-in.
  # Reuse exactly the checked files from this run; never replace an existing release.
  release-candidate:
    needs: [release-rehearsal, build-macos, build-windows]
    if: >-
      startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc.') &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.signed_rc && inputs.publish_rc))
    runs-on: ubuntu-24.04
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require an RC tag and both verified signatures
        env:
          MAC_SIGNED: ${{ needs.build-macos.outputs.signed }}
          WIN_SIGNED: ${{ needs.build-windows.outputs.signed }}
        run: |
          python3 tools/check_rc_ref.py "$GITHUB_REF_NAME"
          test "$MAC_SIGNED" = true
          test "$WIN_SIGNED" = true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-rehearsal
          path: rc-release
      - uses: ./.github/actions/sign-update
        with:
          directory: rc-release/artifacts
          private-key: ${{ secrets.KEYMELIER_UPDATE_SIGNING_KEY }}
      - name: Verify the checked files and publish a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: rc-release
        run: |
          test "$(cat artifacts/SOURCE_COMMIT.txt)" = "$GITHUB_SHA"
          (cd artifacts && sha256sum --check SHA256SUMS.txt)
          python3 -c 'from pathlib import Path; p=Path("release-notes.md"); p.write_text("Release candidate for testing. Enable Settings → Updates → Include release candidates to receive future RCs.\n\n" + p.read_text())'
          gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --draft --prerelease --latest=false --title "KeyMelier $GITHUB_REF_NAME" --notes-file release-notes.md
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
