name: Advisory watch

# Daily scan for new vulnerabilities affecting FIDO keys (NVD + FIDO MDS3
# status reports). Opens an issue per finding for human review; the curated
# data/advisories.json is only changed and signed by a maintainer.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Look back this many days"
        default: "8"

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Ensure the "advisory" label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create advisory --color B60205 --description "Possible new security advisory" 2>/dev/null || true

      - name: Scan for new advisories
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.days || '8' }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/advisory_watch.py --create-issues --days "$LOOKBACK_DAYS"

  verify-signature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.txt
      - name: The published advisory database must be validly signed
        run: python tools/advisories_sign.py verify
