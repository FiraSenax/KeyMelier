name: Signing check
# vsigncheck-win-* tests Certum without publishing; other vsigncheck-* tags
# check macOS. Checks the macOS signing secrets of the release-signing environment before a
# release: import the Developer ID, sign a tiny test app with the hardened
# runtime, notarize it, staple the ticket and let Gatekeeper assess it.
# Triggered by a tag vsigncheck-* (the environment only admits v* tags; the
# Build workflow ignores these tags). Publishes nothing; delete the tag after.
on:
  push:
    tags: ['vsigncheck-*']
permissions:
  contents: read
jobs:
  macos:
    if: ${{ !startsWith(github.ref_name, 'vsigncheck-win-') }}
    runs-on: macos-14
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Import Developer ID
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash tools/import-macos-signing.sh
      - name: Identity is usable for code signing
        env:
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          security find-identity -v -p codesigning "$RUNNER_TEMP/keymelier-signing.keychain-db" | tee "$RUNNER_TEMP/ids.txt"
          grep -qF "\"$IDENTITY\"" "$RUNNER_TEMP/ids.txt" || { echo "::error::MACOS_SIGN_IDENTITY is not a valid identity in the imported P12"; exit 1; }
      - name: Sign a test app (hardened runtime, timestamp)
        env:
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          app="$RUNNER_TEMP/SignCheck.app"
          mkdir -p "$app/Contents/MacOS"
          printf 'int main(void){return 0;}\n' > "$RUNNER_TEMP/main.c"
          clang -arch arm64 -o "$app/Contents/MacOS/SignCheck" "$RUNNER_TEMP/main.c"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>io.github.firasenax.keymelier.signcheck</string>
          <key>CFBundleName</key><string>SignCheck</string>
          <key>CFBundleExecutable</key><string>SignCheck</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          </dict></plist>
          PLIST
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Notarize, staple, Gatekeeper
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          app="$RUNNER_TEMP/SignCheck.app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/signcheck.zip"
          xcrun notarytool submit "$RUNNER_TEMP/signcheck.zip" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait --timeout 20m | tee "$RUNNER_TEMP/notary.txt"
          grep -q "status: Accepted" "$RUNNER_TEMP/notary.txt" || { echo "::error::notarization not accepted"; exit 1; }
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/keymelier-signing.keychain-db" || true
  windows:
    if: startsWith(github.ref_name, 'vsigncheck-win-')
    runs-on: windows-2022
    timeout-minutes: 15
    environment: release-signing
    concurrency:
      group: certum-signing
      cancel-in-progress: false
    env:
      CERTUM_CERT_SHA1: ${{ vars.CERTUM_CERT_SHA1 }}
      CERTUM_CERT_SERIAL: ${{ vars.CERTUM_CERT_SERIAL }}
      CERTUM_CERT_COMMON_NAME: ${{ vars.CERTUM_CERT_COMMON_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compile a harmless signing probe
        shell: pwsh
        run: |
          'class Probe { static void Main() {} }' | Set-Content "$env:RUNNER_TEMP\probe.cs"
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe "/out:$env:RUNNER_TEMP\probe.exe" "$env:RUNNER_TEMP\probe.cs"
          if ($LASTEXITCODE -ne 0) { throw 'Probe compilation failed.' }
      - name: Connect Certum SimplySign
        if: vars.CERTUM_CERT_SHA1 != ''
        uses: ./.github/actions/certum-connect
        with:
          username: ${{ secrets.CERTUM_USERNAME }}
          totp-secret: ${{ secrets.CERTUM_TOTP_SECRET }}
          thumbprint: ${{ vars.CERTUM_CERT_SHA1 }}
      # First-use bootstrap is confined to this non-publishing probe. Release
      # builds still require the exact thumbprint through certum-connect.
      - name: Require the independently verified certificate identity
        if: vars.CERTUM_CERT_SHA1 == ''
        shell: pwsh
        run: |
          if ($env:CERTUM_CERT_SERIAL -notmatch '^[0-9A-Fa-f]{1,40}$' -or
              [string]::IsNullOrWhiteSpace($env:CERTUM_CERT_COMMON_NAME)) {
            throw 'Set the serial number and common name from the issued Certum certificate before the first probe.'
          }
      - name: Install the verified SimplySign client for the first probe
        if: vars.CERTUM_CERT_SHA1 == ''
        shell: pwsh
        run: ./tools/install-simplysign.ps1
      - name: Connect SimplySign to read the issued certificate
        if: vars.CERTUM_CERT_SHA1 == ''
        uses: jay0lee/certum-cloud-code-sign@a3324503499c49090869856eeeecfe95fb613d87
        with:
          username: ${{ secrets.CERTUM_USERNAME }}
          totp_secret: ${{ secrets.CERTUM_TOTP_SECRET }}
          version: '9.4.4.92'
          totp_algorithm: SHA-256
          totp_digits: '6'
          totp_period: '30'
          wait_for_cert_timeout: '60'
          debug: 'false'
      - name: Verify the expected identity and obtain its thumbprint
        if: vars.CERTUM_CERT_SHA1 == ''
        shell: pwsh
        run: |
          . ./tools/windows-signing.ps1
          $matchingCertificates = @(Get-ChildItem Cert:\CurrentUser\My | Where-Object {
            $_.SerialNumber -eq $env:CERTUM_CERT_SERIAL
          })
          if ($matchingCertificates.Count -ne 1) { throw 'Expected exactly one certificate with the independently verified serial number.' }
          $cert = Get-KeyMelierSigningCertificate $matchingCertificates[0].Thumbprint
          if ($cert.Issuer -notmatch 'Certum' -or
              $cert.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) -cne $env:CERTUM_CERT_COMMON_NAME -or
              -not $cert.Verify()) {
            throw 'The issued certificate did not match the expected publisher or trusted certificate chain.'
          }
          "CERTUM_CERT_SHA1=$($cert.Thumbprint)" | Add-Content $env:GITHUB_ENV
          Write-Host "Verified certificate thumbprint: $($cert.Thumbprint)"
          "Verified Certum certificate: $($cert.Thumbprint); serial: $($cert.SerialNumber); expires: $($cert.NotAfter.ToUniversalTime().ToString('u'))" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Sign and verify the probe with the issued certificate
        shell: pwsh
        run: ./tools/sign-windows.ps1 -Path "$env:RUNNER_TEMP/probe.exe"
      - name: Disconnect SimplySign
        if: always()
        shell: pwsh
        run: ./tools/disconnect-simplysign.ps1
