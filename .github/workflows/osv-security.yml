name: OSV dependency security scan

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  pull_request:
    paths:
      - 'uv.lock'
      - 'pyproject.toml'
      - '.github/workflows/osv-security.yml'

permissions:
  contents: read

jobs:
  osv-scan:
    name: Scan locked Python dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Scan uv.lock against OSV
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=uv.lock
