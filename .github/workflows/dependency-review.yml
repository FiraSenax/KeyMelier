name: Dependency review
# On pull requests: fail when a change adds or updates a dependency with a
# known vulnerability (moderate or higher) – before it reaches main.
on:
  pull_request:
    branches: [main, "codex/pr21-*"]
permissions:
  contents: read
jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
