name: MSIX local test
on:
  push:
    branches: ['codex/msix-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  msix:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install locked build and test dependencies
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          python -m pip install --require-hashes --force-reinstall -r requirements.txt -r requirements-build.txt --report build/pip-report.json
          if ($LASTEXITCODE -ne 0) { throw 'Build dependencies failed.' }
          python -m pip install --require-hashes --only-binary=:all: -r requirements-quality.txt
          if ($LASTEXITCODE -ne 0) { throw 'Test dependencies failed.' }
      - name: Test application and package update policy
        run: |
          ruff check app.py keymelier_core tools
          if ($LASTEXITCODE -ne 0) { throw 'Lint failed.' }
          python tools/export_requirements.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Lock exports differ.' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed.' }
          node tests/ui_security.cjs
          if ($LASTEXITCODE -ne 0) { throw 'UI security tests failed.' }
          node tests/msix_ui.cjs
          if ($LASTEXITCODE -ne 0) { throw 'MSIX update UI tests failed.' }
      - name: Record source and build the desktop app
        env:
          KEYMELIER_ICON: static\icon.ico
        run: |
          python tools/write_build_info.py --signed false --ci
          if ($LASTEXITCODE -ne 0) { throw 'Build provenance failed.' }
          pyinstaller --clean --noconfirm keymelier.spec
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed.' }
          python tools/sbom.py --check --strict
          if ($LASTEXITCODE -ne 0) { throw 'SBOM validation failed.' }
      - name: Package and sign with a temporary local test certificate
        run: ./tools/build_msix.ps1
      - name: Install, run, upgrade and remove the test package
        run: ./tools/test_msix.ps1
      - name: Keep test packages and public certificate (never a private key)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: msix-local-test
          path: |
            dist/msix-test/*.msix
            dist/msix-test/*.cer
            dist/msix-test/*.json
            dist/msix-test/TESTING.md
            build/msix-smoke-*/
          if-no-files-found: ignore
          retention-days: 7
