# Dependency updates as pull requests. Every PR runs the full Build workflow
# (tests, all platform builds, strict SBOM, Linux compatibility), so an update
# that breaks packaging or licensing fails there.
#
# Python: update the project/lock, never the generated requirements exports.
# Regenerate all three exports on the PR with tools/export_requirements.py.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    exclude-paths:
      - requirements.txt
      - requirements-build.txt
      - requirements-quality.txt
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies]
    commit-message:
      prefix: ci
