[project]
name = "keymelier"
version = "1.8.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fido2==2.2.1",
  "pywebview==6.2.1",
  "requests==2.34.2",
  "yubikey-manager==5.9.2",
  "cryptography==50.0.1",
  "pyOpenSSL==26.4.0",
  "keyring==25.7.0",
  # Linux: Qt web view (LGPL, self-contained in the AppImage)
  "PySide6-Essentials==6.11.2 ; sys_platform == 'linux'",
  "PySide6-Addons==6.11.2 ; sys_platform == 'linux'",
  "qtpy==2.4.3 ; sys_platform == 'linux'",
]

[dependency-groups]
build = [
    "dmgbuild==1.6.7 ; sys_platform == 'darwin'",
    "pyinstaller==6.22.3",
]
