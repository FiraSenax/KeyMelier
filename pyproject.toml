[project]
name = "keymelier"
version = "1.8.9"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fido2==2.2.1",
  "pywebview==6.2.1",
  "requests==2.34.2",
  "yubikey-manager==5.9.2",
  "cryptography==50.0.2",
  "pyOpenSSL==26.4.0",
  "keyring==25.7.0",
  "zxing-cpp==3.1.1",
  "pillow==13.0.0",
  # One upstream pin keeps Essentials, Addons and Shiboken at the same version.
  # Linux: Qt web view (LGPL, self-contained in the AppImage)
  # 6.12.0 is affected by CVE-2026-105924; wait for a fixed PySide release.
  # 6.11.3 supports Python <3.15, so all release builds use Python 3.14.10.
  "PySide6==6.11.3 ; sys_platform == 'linux'",
  "qtpy==2.4.3 ; sys_platform == 'linux'",
]

[dependency-groups]
build = [
    "dmgbuild==1.6.7 ; sys_platform == 'darwin'",
    "pyinstaller==6.22.3",
    # zxing-cpp is rebuilt with these exact inputs; no opaque nanobind wheel copy.
    "nanobind==3.1.0",
    "scikit-build-core==1.1.2",
    "cmake==4.4.4",
    "ninja==1.13.2",
    "wheel==0.48.0",
]
quality = [
    "ruff==0.17.4",
    "PyYAML==6.0.3",
    "uv==0.13.7",
]

# Correctness checks, without imposing a bulk formatting rewrite.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]
