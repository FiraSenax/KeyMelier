[project]
name = "keymelier"
version = "1.8.6"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fido2==2.2.1",
  "pywebview==6.2.1",
  "requests==2.34.2",
  "yubikey-manager==5.9.2",
  "cryptography==50.0.2",
  "pyOpenSSL==26.4.0",
  "keyring==25.7.0",
  "zxing-cpp==3.1.1",
  "pillow==13.0.0",
  # One upstream pin keeps Essentials, Addons and Shiboken at the same version.
  # Linux: Qt web view (LGPL, self-contained in the AppImage)
  "PySide6==6.11.2 ; sys_platform == 'linux'",
  "qtpy==2.4.3 ; sys_platform == 'linux'",
]

[dependency-groups]
build = [
    "dmgbuild==1.6.7 ; sys_platform == 'darwin'",
    "pyinstaller==6.22.3",
    # zxing-cpp is rebuilt with these exact inputs; no opaque nanobind wheel copy.
    "nanobind==2.11.0",
    "scikit-build-core==1.1.1",
    "cmake==4.4.4",
    "ninja==1.13.2",
    "wheel==0.46.3",
]
quality = [
    "ruff==0.17.1",
    "PyYAML==6.0.3",
    "uv==0.13.4",
]

# Correctness checks, without imposing a bulk formatting rewrite.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]
